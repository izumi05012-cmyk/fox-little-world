<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- the little world has its own colours: don't let a browser's dark
         mode repaint the glass grey and the paper black -->
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#faf6f2" />
    <!-- 添加到桌面 makes it an app called 小窝, with the two foxes as its icon -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="小窝" />
    <script>
      // open in the colour of the last view outside (or night by the clock),
      // so a dark room never starts with a white flash
      (function () {
        var scene;
        try { scene = localStorage.getItem("fox-last-scene"); } catch (e) {}
        var h = new Date().getHours();
        if (!scene) scene = h >= 6 && h < 18 ? "day" : "night";
        if (scene === "day" && (h < 6 || h >= 18)) scene = "night";
        document.documentElement.dataset.scene = scene;
      })();
    </script>
    <title>Fox Little World</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
