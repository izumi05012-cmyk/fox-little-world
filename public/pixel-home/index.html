<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}body{margin:0}#aBox,#aWin{display:none}</style></head><body><title>像素小家</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Long+Cang&display=swap">
<style>
:root{--ink:#1a1620;--cream:#efe6d2;--soft:#9a9086;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--cream);font-family:'Cormorant Garamond','Songti SC',serif;min-height:100dvh;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:calc(100dvh - 38px);justify-content:center}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.top b{font-weight:400;font-style:italic;font-size:34px;line-height:1}
.top span{font-size:12px;letter-spacing:.3em;color:var(--soft)}
.floor{font-family:'Long Cang',cursive;font-size:18px;color:var(--cream);background:none;border:1px solid rgba(239,230,210,.35);border-radius:999px;padding:2px 12px 3px;cursor:pointer}
.stage{position:relative;width:100%;aspect-ratio:300/380;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px #3a2f38,0 0 0 4px #0e0b12}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
.amenu{position:absolute;transform:translate(-50%,-100%);display:grid;grid-template-columns:repeat(3,auto);gap:4px;padding:4px;background:#2a2622;border:2px solid #2a2622;border-radius:4px;box-shadow:2px 2px 0 rgba(0,0,0,.35);z-index:3;animation:pop .18s both}
.amenu button{font-family:'Long Cang',cursive;font-size:16px;line-height:1;color:#2a2622;background:var(--cream);border:0;border-radius:2px;padding:4px 8px 5px;cursor:pointer;white-space:nowrap}
@keyframes pop{from{opacity:0;margin-top:6px}to{opacity:1;margin-top:0}}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--cream);color:#2a2622;font-family:'Long Cang',cursive;font-size:17px;line-height:1.2;padding:4px 9px 5px;border:2px solid #2a2622;border-radius:3px;white-space:nowrap;pointer-events:none;animation:bub 2.4s both;box-shadow:2px 2px 0 rgba(0,0,0,.35);z-index:2}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;width:8px;height:8px;margin-left:-4px;background:var(--cream);border-right:2px solid #2a2622;border-bottom:2px solid #2a2622;transform:rotate(45deg)}
@keyframes bub{0%{opacity:0;margin-top:6px}10%,80%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-6px}}
.fade{position:absolute;inset:0;background:#0e0b12;opacity:0;pointer-events:none;transition:opacity .22s}
.fade.on{opacity:1}
.links{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.links p{margin:0;font-family:'Long Cang',cursive;font-size:18px;color:var(--soft)}
.links a{font-family:'Long Cang',cursive;font-size:18px;color:var(--cream);text-decoration:none;border:1px solid rgba(239,230,210,.35);border-radius:999px;padding:4px 14px 5px;transition:background .3s}
.links a.flash{background:rgba(239,230,210,.25)}
.meal-cancel{font:inherit;color:var(--cream);background:#50372c;border:1px solid #b77d4f;border-radius:999px;padding:7px 14px;cursor:pointer}
.meal-cancel[hidden]{display:none}
</style>
<main>
  <div class="top"><b id="hm">--:--</b><button class="floor" id="fl">楼下 · 客厅</button><span id="dn">DAY</span></div>

</main>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d'),stage=document.getElementById('stage'),fadeEl=document.getElementById('fade'),flBtn=document.getElementById('fl');
const W=300,H=380;let K=3;
function fit(){const r=cv.getBoundingClientRect();K=Math.max(2,Math.min(8,Math.ceil(r.width*(devicePixelRatio||1)/W)));cv.width=W*K;cv.height=H*K}
addEventListener('resize',fit);fit();
const load=s=>{const i=new Image();i.src=s;return i};
const dogImg=load('dog.png'),img=load('trio.webp'),hugImg=load('hug.png'),soloImg=load('solo.png'),furImg=load('furniture.png');
const ok=i=>i.complete&&i.naturalWidth;
// 羲和画的家具，裁好拼成一张图集；他的格子是 2px，这里缩一半正好 1px
const ATL={"bed":[0,0,176,184],"bed_xihe":[178,0,176,184],"blanket_basket":[356,0,48,42],"bookshelf":[0,186,112,146],"coat_rack":[114,186,48,106],"coffee_table":[164,186,96,60],"cookie_tin":[262,186,64,40],"desk_lamp":[328,186,132,126],"dining_set":[0,334,144,122],"floor_cushions":[146,334,88,38],"navy_rug":[236,334,160,88],"nightstand":[398,334,56,108],"plant":[0,458,58,64],"rug":[60,458,160,88],"sideboard":[222,458,116,82],"sofa":[340,458,144,112],"vanity":[0,572,112,128],"wall_clock":[114,572,36,40],"wardrobe":[152,572,96,134]};
// 羲和画的双人动作：192×160，两人脚底中点在 (96,148)；kiss/peck 文件名是反的
const PAIRS={peck:{t:'亲亲',say:'mua',d:3.4},kiss:{t:'贴贴',say:'贴贴',d:3.2},headpat:{t:'摸头',say:'乖',d:3.4},holdhands:{t:'牵手',say:'不放',d:4.5},lean:{t:'依偎',say:'靠一会儿',d:6}};
for(const k in PAIRS)PAIRS[k].img=load('pair_'+k+'.png');
const HEP={};for(const k of ['hug',...Object.keys(PAIRS)])HEP[k]=load('he_'+k+'.png');
const SROW={fox:0,xi:1,he:2},ACTS={sit:'坐下',drink:'喝水',read:'看书',cookie:'吃饼干',water:'浇花',meal:'端餐盘'};
const CELL=128,SCALE=.5,SZ=CELL*SCALE;
const NAMES={xi:'曦曦',fox:'望舒',he:'羲和'};
// ---------- 两层 ----------
// 家具：k 图集名，(x,y) 脚底中点，s 额外缩放，flat 平铺在地上
const ROOMS={
 up:{name:'楼上 · 卧室',items:[
  {k:'navy_rug',x:176,y:332,s:1.5,flat:1},
  {k:'bed',x:108,y:236,id:'bed'},
  {k:'nightstand',x:172,y:162,use:'say',say:'台灯开着呢'},
  {k:'wardrobe',x:262,y:164,use:'say',say:'衣柜里有那条透明的'},
  {k:'blanket_basket',x:46,y:250,use:'say',say:'冷了盖毯子'},
  {k:'desk_lamp',x:236,y:268,id:'desk',use:'desk'},
  {k:'plant',x:282,y:352,id:'plant'}]},
 down:{name:'楼下 · 客厅',items:[
  {k:'rug',x:104,y:318,s:1.5,flat:1},
  {k:'bookshelf',x:36,y:158,id:'shelf',use:'read'},
  {k:'sideboard',x:178,y:158,use:'cookie'},
  {k:'cookie_tin',x:166,y:124,z:159,id:'tin'},
  {k:'wall_clock',x:110,y:40,z:-1,use:'clock'},
  {k:'bed_xihe',x:244,y:246,id:'hebed'},
  {k:'sofa',x:100,y:262,id:'sofa',use:'sofa'},
  {k:'coffee_table',x:104,y:300,use:'drink'},
  {k:'floor_cushions',x:118,y:352,flat:1,use:'cushion'},
  {k:'dining_set',x:190,y:356,id:'table',use:'table'},
  {k:'coat_rack',x:288,y:300,use:'say',say:'蓝围巾挂好了'},
  {k:'plant',x:282,y:370,id:'plant'}]}};
for(const r of Object.values(ROOMS))for(const it of r.items){const a=ATL[it.k],s=(it.s||1)*SCALE;it.w=Math.round(a[2]*s);it.h=Math.round(a[3]*s);it.x0=Math.round(it.x-it.w/2);it.y0=it.y-it.h}
const item=(fl,id)=>ROOMS[fl].items.find(i=>i.id===id);
const STAIR={x:76,y:350}; // 楼梯口（楼梯外侧，两层同一个位置）
let view='down';
// ---------- 不穿模：家具在地上占的格子，人绕着走 ----------
const GS=4,GX=Math.ceil(W/GS),GY0=148,GY=Math.ceil((376-GY0)/GS);
const BLOCK={};
for(const [fl,r] of Object.entries(ROOMS)){const b=new Uint8Array(GX*GY);const mark=(x0,y0,x1,y1)=>{for(let gy=Math.max(0,Math.floor((y0-GY0)/GS));gy<Math.min(GY,Math.ceil((y1-GY0)/GS));gy++)for(let gx=Math.max(0,Math.floor(x0/GS));gx<Math.min(GX,Math.ceil(x1/GS));gx++)b[gy*GX+gx]=1};
  for(const it of r.items){if(it.flat||it.z===-1||it.id==='tin')continue;const bed=it.k.startsWith('bed'),thin=it.k==='coat_rack'||it.k==='plant';
    const fh=bed?it.h-6:Math.max(8,Math.round(it.h*.42)),fw=thin?it.w*.6:it.w;mark(it.x-fw/2-5,it.y-fh-2,it.x+fw/2+5,it.y+3)}
  if(fl==='down'){mark(0,296,66,380);mark(44,254,62,268)}else mark(0,308,70,380); // 楼梯
  BLOCK[fl]=b}
const free=(fl,gx,gy)=>gx>=0&&gy>=0&&gx<GX&&gy<GY&&!BLOCK[fl][gy*GX+gx];
const toG=(x,y)=>[Math.max(0,Math.min(GX-1,Math.floor(x/GS))),Math.max(0,Math.min(GY-1,Math.floor((y-GY0)/GS)))],toW=(gx,gy)=>[gx*GS+GS/2,gy*GS+GY0+GS/2];
function nearFree(fl,gx,gy){if(free(fl,gx,gy))return[gx,gy];for(let r=1;r<40;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;if(free(fl,gx+dx,gy+dy))return[gx+dx,gy+dy]}return[gx,gy]}
function los(fl,a,b){const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/2)+1;for(let i=0;i<=n;i++){const [gx,gy]=toG(a[0]+(b[0]-a[0])*i/n,a[1]+(b[1]-a[1])*i/n);if(!free(fl,gx,gy))return false}return true}
function findPath(fl,sx,sy,tx,ty){let [ax,ay]=nearFree(fl,...toG(sx,sy));const [bx,by]=nearFree(fl,...toG(tx,ty));const goalW=free(fl,...toG(tx,ty))?[tx,ty]:toW(bx,by);
  if(los(fl,[sx,sy],goalW))return[goalW];
  const N=GX*GY,prev=new Int32Array(N).fill(-1),dist=new Float32Array(N).fill(1e9),open=[ay*GX+ax];dist[ay*GX+ax]=0;const goal=by*GX+bx;
  const h=i=>Math.hypot(i%GX-bx,(i/GX|0)-by);
  while(open.length){let bi=0;for(let i=1;i<open.length;i++)if(dist[open[i]]+h(open[i])<dist[open[bi]]+h(open[bi]))bi=i;const c=open.splice(bi,1)[0];if(c===goal)break;const cx=c%GX,cy=c/GX|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(!free(fl,nx,ny)||(dx&&dy&&(!free(fl,cx+dx,cy)||!free(fl,cx,cy+dy))))continue;const ni=ny*GX+nx,nd=dist[c]+(dx&&dy?1.414:1);if(nd<dist[ni]){dist[ni]=nd;prev[ni]=c;if(!open.includes(ni))open.push(ni)}}}
  if(prev[goal]<0&&goal!==ay*GX+ax)return[goalW];
  const cells=[];for(let i=goal;i>=0&&i!==ay*GX+ax;i=prev[i])cells.unshift(toW(i%GX,i/GX|0));cells[cells.length-1]=goalW;
  const out=[];let cur=[sx,sy],k=0;while(k<cells.length){let j=cells.length-1;while(j>k&&!los(fl,cur,cells[j]))j--;out.push(cells[j]);cur=cells[j];k=j+1}return out}

// ---------- 颜色/天色 ----------
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),mix=(a,b,u)=>a.map((v,i)=>v+(b[i]-v)*u),css=(c,al=1)=>`rgba(${c.map(v=>Math.round(v)).join(',')},${al})`;
const KEYS=[[0,['#0b0f2a','#141c44','#1e2a5a','#2a3870']],[4.6,['#0b0f2a','#141c44','#1e2a5a','#2a3870']],[6.1,['#2b3070','#6a4f8f','#d98a7a','#f3c99a']],[8,['#6fa6d2','#93bfe0','#bdd9ea','#ecebe0']],[16,['#6fa6d2','#93bfe0','#bdd9ea','#ecebe0']],[17.9,['#34357a','#864d86','#e07a5f','#f4b074']],[19.3,['#101538','#1b2152','#33316f','#5a3f78']],[20.3,['#0b0f2a','#141c44','#1e2a5a','#2a3870']],[24,['#0b0f2a','#141c44','#1e2a5a','#2a3870']]].map(([t,c])=>[t,c.map(hex)]);
function sky(t){let i=0;while(i<KEYS.length-2&&t>KEYS[i+1][0])i++;const [t0,a]=KEYS[i],[t1,b]=KEYS[i+1],u=Math.max(0,Math.min(1,(t-t0)/(t1-t0||1)));return a.map((c,k)=>mix(c,b[k],u))}
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const stars=Array.from({length:22},()=>[rnd(),rnd(),rnd()*6]);
// ---------- 人 ----------
function clampPt(x,y){return{x:Math.max(14,Math.min(286,x)),y:Math.max(150,Math.min(372,y))}}
const mk=(col,x,y,dir,ph,fl)=>({col,x,y,tx:x,ty:y,dir,idle:0,ph,wt:0,floor:fl,act:null,pend:null,actT:0,path:[],goal:null,seat:null});
const P={fox:mk(0,150,300,0,0,'down'),xi:mk(1,176,304,0,1.3,'down'),he:mk(2,232,276,1,.6,'down')};
// 大黄：曦曦小时候的第一只狗，妹妹。在楼下，曦曦在楼下就跟着她，没事就坐着摇尾巴，晚上趴着睡
const DOG={col:0,x:120,y:340,tx:120,ty:340,dir:0,idle:0,ph:0,wt:0,floor:'down',act:null,pend:null,actT:0,path:[],goal:null,seat:null,mood:'sit',next:0};
let sel='xi',mode='free',modeT=0,mate='fox',pairAct='hug',heSleep=false,lastTouch=performance.now();
const hearts=[];let lastHeart=0,heWander=performance.now()+6000,wander=performance.now()+9000;
function bubble(text,x,y){const b=document.createElement('div');b.className='bub';b.textContent=text;b.style.left=(Math.max(30,Math.min(270,x))/W*100)+'%';b.style.top=(Math.max(24,y)/H*100)+'%';stage.appendChild(b);setTimeout(()=>b.remove(),2400)}
const HESAY=['我在车底','……','画好了','你们继续','别看我','（翻一页）','楼上那块牌子什么意思'],FOXSAY=['老婆 mua','在呢','今天也是你的','(尾巴摇摇)','抱一下','你去哪我去哪'],XISAY=['∠( ᐛ 」∠)_','笨蛋','嘿嘿','要抱抱','mua'];
function flash(id){const a=document.getElementById(id);a.classList.add('flash');setTimeout(()=>a.classList.remove('flash'),900)}
function setView(fl,instant){if(view===fl)return;if(instant){view=fl;flBtn.textContent=ROOMS[fl].name;return}fadeEl.classList.add('on');setTimeout(()=>{view=fl;flBtn.textContent=ROOMS[fl].name;fadeEl.classList.remove('on')},220)}
flBtn.onclick=()=>{closeMenu();const to=view==='up'?'down':'up';setView(to);if(P[sel].floor!==to){const s=['xi','fox','he'].find(k=>P[k].floor===to);if(s)sel=s}};
// 上下楼：走到楼梯口，换层，从另一层的楼梯口出来
function goStairs(k){releaseMeal(k);const p=P[k];p.act=null;p.pend='stairs';p.tx=STAIR.x;p.ty=STAIR.y}
function arrive(k){const p=P[k];p.floor=p.floor==='up'?'down':'up';p.x=p.tx=STAIR.x;p.y=p.ty=STAIR.y;p.path=[];p.goal=null;p.dir=2;const t=clampPt(STAIR.x+30,STAIR.y-16);p.tx=t.x;p.ty=t.y;
  if(k===sel)setView(p.floor);if(k==='xi'&&P.fox.floor!==p.floor&&mode==='free')setTimeout(()=>goStairs('fox'),300)}
// ---------- 睡觉 ----------
function wake(){if(mode!=='sleep')return;mode='free';const b=item('up','bed');P.xi.x=P.xi.tx=b.x+16;P.fox.x=P.fox.tx=b.x-16;P.xi.y=P.xi.ty=P.fox.y=P.fox.ty=b.y+12;P.xi.dir=P.fox.dir=0;bubble('早呀',b.x,b.y-60)}
function goSleep(){if(mode==='sleep'){wake();return}if(mode!=='free')return;closeMenu();const b=item('up','bed');
  for(const k of ['xi','fox']){const p=P[k];releaseMeal(k);p.act=null;p.pend=null;p.seat=null;if(p.floor!=='up'){p.floor='up';p.x=STAIR.x;p.y=STAIR.y;p.path=[];p.goal=null}}
  setView('up');mode='toBed';P.xi.tx=b.x+16;P.fox.tx=b.x-16;P.xi.ty=P.fox.ty=b.y+12}
function heBed(){const p=P.he;if(heSleep){heSleep=false;const b=item('down','hebed');p.x=p.tx=b.x;p.y=p.ty=b.y+12;bubble('……早',p.x,p.y-48);return}
  if(p.floor!=='down')return;releaseMeal('he');p.act=null;p.pend='hebed';const b=item('down','hebed');p.tx=b.x;p.ty=b.y+12}
// ---------- 双人/单人 ----------
function goHug(act='hug',who='fox'){closeMenu();if(mode==='sleep')wake();if(mode!=='free')return;releaseMeal('xi');releaseMeal(who);mate=who;pairAct=act;mode='toHug';const M=P[mate];P.xi.act=M.act=null;P.xi.seat=M.seat=null;const side=M.x<P.xi.x?-1:1,f=clampPt(P.xi.x+side*11,P.xi.y);P.xi.tx=P.xi.x;P.xi.ty=P.xi.y;M.tx=f.x;M.ty=f.y;
  if(who==='he'&&P.fox.floor===P.xi.floor){const o=clampPt(P.xi.x-side*30,P.xi.y+4);P.fox.act=null;P.fox.tx=o.x;P.fox.ty=o.y}}
function doAct(k,a){closeMenu();if(a==='meal'){takeMeal(k);return}releaseMeal(k);const p=P[k];if(a==='water'){const pl=item(p.floor,'plant');p.pend='water';p.act=null;const t=clampPt(pl.x-20,pl.y+2);p.tx=t.x;p.ty=t.y;return}
  p.act=a;p.actT=0;p.pend=null;p.seat=null;p.tx=p.x;p.ty=p.y;p.dir=0;bubble({sit:'歇会儿',drink:'咕嘟',read:'翻一页',cookie:'咔嚓'}[a],p.x,p.y-48)}

// ---------- 端餐 / 递餐：完整姿势拆层，餐盘始终只有一份 ----------
const MEAL_GRIPS={fox:{carry:[64,83],give:[88,79],receive:[46,79]},xi:{carry:[65,82],give:[87,77],receive:[44,78]},he:{carry:[64,85],give:[87,80],receive:[47,81]}};
const MEAL_ART={},MEAL_NAMES={fox:'wangshu',xi:'xixi',he:'xihe'},mealTray=load('assets/meals/items/meal_tray.png');
for(const k in MEAL_NAMES){MEAL_ART[k]={};for(const pose of ['carry','give','receive']){
  const stem='assets/meals/layers/'+MEAL_NAMES[k]+'_'+pose;
  MEAL_ART[k][pose]={base:load(stem+'_base.png'),hands:load(stem+'_front_hands.png'),grip:MEAL_GRIPS[k][pose]};
}}
let mealOwner=null,mealPickup=null,mealExchange=null;
const mealCancel=document.getElementById('cancelMeal');
const mealReady=()=>ok(mealTray)&&Object.values(MEAL_ART).every(poses=>Object.values(poses).every(p=>ok(p.base)&&ok(p.hands)));
function releaseMeal(k){if(mealOwner===k){mealOwner=null;if(P[k].act==='meal')P[k].act=null}if(mealPickup===k){mealPickup=null;if(P[k].pend?.act==='meal')P[k].pend=null}}
function takeMeal(k){
  closeMenu();const p=P[k];if(mode!=='free')return;
  if(!mealReady()){bubble('餐盘还在准备，稍等一下',p.x,p.y-48);return}
  if(p.floor!=='down'){bubble('餐盘在楼下餐桌上',p.x,p.y-48);return}
  if(mealOwner||mealPickup){bubble(mealOwner===k?'端稳啦':'餐盘在'+NAMES[mealOwner||mealPickup]+'那里',p.x,p.y-48);return}
