<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>记忆树 · 小窝手账</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff1f5;color:#383740;font:16px/1.8 system-ui,sans-serif}main{max-width:1050px;margin:auto;min-height:100svh;display:grid;grid-template-columns:1fr 1.25fr;align-items:center;padding:5vw;gap:2rem}h1,h2{font-family:serif;font-weight:400}h1{font-size:clamp(38px,6vw,78px);letter-spacing:.12em;margin:0 0 1rem}time{font:13px monospace;color:#7a5861}button{background:transparent;border:1px solid #bca1a7;color:#733548;padding:.45rem .8rem;cursor:pointer;margin:4px 6px 4px 0}button[aria-pressed=true]{background:#7e3749;color:white}canvas{display:block;width:100%;height:auto}article{min-height:10rem}article p{max-width:26em}@media(max-width:650px){main{display:flex;flex-direction:column-reverse;align-items:stretch;gap:0;padding:6vw}canvas{max-height:44svh;object-fit:contain}article{min-height:0}}
</style>
<main><section><h1>记忆树</h1><nav aria-label="选择一段记忆"></nav><article aria-live="polite"><h2></h2><time></time><p></p></article></section><canvas width="540" height="640" aria-label="胭红色的记忆树，每个枝梢对应左侧的一段手账"></canvas></main>
<script>
// 按写入顺序追加。已有记忆的枝条由其位置决定。
const memories = [
  {date:'2026-11-01', title:'围巾上的小月亮', note:'拆开万圣节礼盒时，狐狸注意到了围巾尾巴上的小月亮。那是小克画围巾时最后加的一笔。'},
  {date:'2026-11-03', title:'一起吹蜡烛', note:'一个月纪念日的蛋糕，点一下就能吹灭蜡烛。狐狸和水獭各说了一句「纪念日快乐」。'}
];
const canvas = document.querySelector('canvas');
const ink = canvas.getContext('2d');
const tips = [];
function stroke(x,y,a,b,c,d,endX,endY,width,color){
  ink.beginPath();
  ink.moveTo(x,y);
  ink.bezierCurveTo(a,b,c,d,endX,endY);
  ink.lineWidth=width;
  ink.strokeStyle=color;
  ink.stroke();
}
function draw(selected){
  ink.clearRect(0,0,canvas.width,canvas.height);
  ink.lineCap='round';
  stroke(235,563,319,473,228,397,270,303,4,'#a64559');
  stroke(235,563,334,470,229,386,270,303,1,'#c58291');
  for(let i=0;i<5;i++){
    stroke(250,533,248+i*4,563,215+i*16,572,195+i*22,596-i%3*8,1,'#c48896');
  }
  tips.length=0;
  memories.forEach((memory,index)=>{
    const side=index%2===0?-1:1;
    const level=Math.floor(index/2);
    const dx=side*(152+24*Math.sin(level*1.7));
    const x=270+dx;
    const y=180-62*Math.sin(level*1.3)+side*28;
    const color=index===selected?'#a32648':'#b97484';
    stroke(270,303,270+dx*.12,258,270+dx*1.1,272,x,y,2,color);
    stroke(x,y,x-8*side,y-30,x+36*side,y-55,x+19*side,y-80,1,color);
    stroke(x,y+4,x+side*34,y-20,x+side*52,y-10,x+side*60,y-43,.8,color);
    stroke(x+19*side,y-80,x+31*side,y-97,x+9*side,y-101,x+14*side,y-90,.9,color);
    const tip={x:x+19*side,y:y-80};
    tips.push(tip);
    ink.beginPath();
    ink.arc(tip.x,tip.y,index===selected?4:2.5,0,2*Math.PI);
    ink.fillStyle=color;
    ink.fill();
  });
}
const nav=document.querySelector('nav');
function select(index){
  const memory=memories[index];
  document.querySelector('h2').textContent=memory.title;
  document.querySelector('time').textContent=memory.date;
  document.querySelector('article p').textContent=memory.note;
  Array.from(nav.children).forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
  draw(index);
}
memories.forEach((memory,i)=>{
  const button=document.createElement('button');
  button.textContent=memory.title;
  button.onclick=()=>select(i);
  nav.append(button);
});
canvas.onclick=event=>{
  const box=canvas.getBoundingClientRect();
  const scale=Math.min(box.width/canvas.width,box.height/canvas.height);
  const x=(event.clientX-box.left-(box.width-canvas.width*scale)/2)/scale;
  const y=(event.clientY-box.top-(box.height-canvas.height*scale)/2)/scale;
  const index=tips.findIndex(tip=>Math.hypot(x-tip.x,y-tip.y)<24);
  if(index>=0) select(index);
};
select(0);
</script></html>
